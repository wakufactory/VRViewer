<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>VRV Parameter Panel</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: #1f1f24;
      color: #f2f4f8;
    }
    body {
      margin: 0;
      padding: 24px 16px 48px;
      display: flex;
      justify-content: center;
    }
    main {
      width: min(480px, 100%);
      display: grid;
      gap: 20px;
      background: rgba(33, 33, 40, 0.88);
      border-radius: 16px;
      padding: 24px 28px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    h1 {
      font-size: 1.4rem;
      margin: 0;
      letter-spacing: .03em;
    }
    section {
      display: grid;
      gap: 12px;
    }
    label {
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #48b0ff;
    }
    select, button, input[type="range"] {
      font-size: 1rem;
    }
    select, button {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.08);
      color: inherit;
    }
    button {
      cursor: pointer;
      transition: background 120ms ease, transform 120ms ease;
    }
    button:hover {
      background: rgba(255,255,255,0.14);
    }
    button:active {
      transform: scale(0.97);
    }
    .status {
      font-size: 0.85rem;
      opacity: 0.85;
    }
    .controls-row {
      display: flex;
      gap: 12px;
    }
    .controls-row > * {
      flex: 1 1 0;
    }
    @media (max-width: 480px) {
      main {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Viewer Parameters</h1>
      <p style="margin:0;font-size:0.9rem;opacity:0.75;">
        スライダーやセレクトで値を調整すると、ビューアーへリアルタイムに送信されます。
      </p>
    </section>

    <section>
      <label for="scale-slider">
        モデルスケール
        <span id="scale-value">1.00</span>
      </label>
      <input id="scale-slider" type="range" min="-1" max="2" step="0.001" value="0" />
    </section>

    <section>
      <label for="rotateY-slider">
        モデル向き (°)
        <span id="rotateY-value">0°</span>
      </label>
      <input id="rotateY-slider" type="range" min="0" max="360" step="1" value="0" />
    </section>

    <section class="controls-row">
      <button type="button" id="reset-btn">パラメータを初期化</button>
    </section>

    <section class="status">
      <span id="connection-status">接続中...</span>
    </section>
  </main>

  <script>
    (() => {
      const scaleInput = document.getElementById('scale-slider');
      const scaleValue = document.getElementById('scale-value');
      const rotateInput = document.getElementById('rotateY-slider');
      const rotateValue = document.getElementById('rotateY-value');
      const statusEl = document.getElementById('connection-status');
      const resetBtn = document.getElementById('reset-btn');

      if (!scaleInput || !scaleValue || !rotateInput || !rotateValue || !statusEl) {
        console.warn('[param] 必要なDOMが見つからないため初期化を中断します');
        return;
      }

      let ws = null;
      let reconnectTimer = null;
      let pendingFullSync = false;
      let suppressUiEvents = false;
      let latestState = { modelScale: 1, rotateY: 0 };

      const SCALE_MIN = 0.1;
      const SCALE_MAX = 100;
      const SCALE_MIN_EXP = Math.log10(SCALE_MIN);
      const SCALE_MAX_EXP = Math.log10(SCALE_MAX);
      const normalizeAngle = (deg) => {
        const numeric = Number(deg);
        if (!Number.isFinite(numeric)) return 0;
        const wrapped = numeric % 360;
        const positive = wrapped < 0 ? wrapped + 360 : wrapped;
        const base = positive === 0 ? 0 : positive;
        if (base === 0 && numeric > 0) {
          return 360;
        }
        return base;
      };

      const sliderToScale = (sliderValue) => {
        const exp = Number(sliderValue);
        if (!Number.isFinite(exp)) return 1;
        const clampedExp = Math.min(Math.max(exp, SCALE_MIN_EXP), SCALE_MAX_EXP);
        const value = Math.pow(10, clampedExp);
        return Number.isFinite(value) ? value : 1;
      };

      const scaleToSlider = (scale) => {
        const clamped = Math.min(Math.max(Number(scale) || 1, SCALE_MIN), SCALE_MAX);
        const exp = Math.log10(clamped);
        return Number.isFinite(exp) ? exp : 0;
      };

      const setScaleSliderValue = (scale) => {
        const sliderValue = scaleToSlider(scale);
        scaleInput.value = sliderValue.toFixed(3);
      };

      const updateScaleLabel = (scale) => {
        const numeric = Number(scale);
        scaleValue.textContent = Number.isFinite(numeric) ? numeric.toFixed(2) : '---';
      };

      const updateRotateLabel = (deg) => {
        const numeric = Number(deg);
        rotateValue.textContent = Number.isFinite(numeric) ? `${Math.round(numeric)}°` : '---';
      };

      const applyStateToUi = (state) => {
        suppressUiEvents = true;
        if (typeof state.modelScale === 'number' && !Number.isNaN(state.modelScale)) {
          const scale = Math.min(Math.max(state.modelScale, SCALE_MIN), SCALE_MAX);
          setScaleSliderValue(scale);
          updateScaleLabel(scale);
        }
        if (typeof state.rotateY === 'number' && Number.isFinite(state.rotateY)) {
          const angle = normalizeAngle(state.rotateY);
          const clamped = Math.min(Math.max(Math.round(angle), Number(rotateInput.min)), Number(rotateInput.max));
          rotateInput.value = String(clamped);
          updateRotateLabel(clamped);
        }
        suppressUiEvents = false;
      };

      const sendCurrentState = () => {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          pendingFullSync = true;
          return;
        }
        try {
          ws.send(JSON.stringify({ type: 'params', params: latestState }));
          pendingFullSync = false;
        } catch (err) {
          console.warn('[param] パラメータ送信に失敗しました', err);
          pendingFullSync = true;
        }
      };

      const updateStateAndSend = (partial) => {
        if (!partial || typeof partial !== 'object') return;
        latestState = { ...latestState, ...partial };
        sendCurrentState();
      };

      const setStatus = (text) => {
        statusEl.textContent = text;
      };

      const handleIncomingParams = (params) => {
        if (!params || typeof params !== 'object') return;
        latestState = { ...latestState, ...params };
        applyStateToUi(latestState);
      };

      const connect = () => {
        if (reconnectTimer) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }
        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        const basePath = location.pathname.replace(/\/[^\/]*$/, '');
        const url = `${proto}://${location.host}${basePath || ''}/`;
        setStatus('接続中...');
        ws = new WebSocket(url);

        ws.onopen = () => {
          setStatus('接続済み');
          sendCurrentState();
        };

        ws.onmessage = (event) => {
          const data = event.data;
          let parsed = null;
          if (typeof data === 'string') {
            try { parsed = JSON.parse(data); } catch (_) { parsed = null; }
          }
          if (parsed && typeof parsed === 'object') {
            if (parsed.type === 'params') {
              handleIncomingParams(parsed.params);
              return;
            }
            if (parsed.type === 'selection') {
              // selection messages are acknowledged but ignored in this panel
              return;
            }
            if (parsed.params && parsed.type == null) {
              handleIncomingParams(parsed.params);
              return;
            }
          }
        };

        ws.onerror = () => {
          setStatus('接続エラー (再試行)');
        };

        ws.onclose = () => {
          setStatus('未接続 (再接続待ち)');
          reconnectTimer = setTimeout(connect, 1000);
        };
      };

      scaleInput.addEventListener('input', () => {
        if (suppressUiEvents) return;
        const scale = sliderToScale(scaleInput.value);
        updateScaleLabel(scale);
        if (Number.isFinite(scale)) {
          updateStateAndSend({ modelScale: scale });
        }
      });

      rotateInput.addEventListener('input', () => {
        if (suppressUiEvents) return;
        const value = Math.min(Math.max(Number(rotateInput.value), Number(rotateInput.min)), Number(rotateInput.max));
        updateRotateLabel(value);
        if (Number.isFinite(value)) {
          updateStateAndSend({ rotateY: value });
        }
      });

      resetBtn.addEventListener('click', () => {
        latestState = { modelScale: 1, rotateY: 0 };
        applyStateToUi(latestState);
        sendCurrentState();
      });

      window.addEventListener('beforeunload', () => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.close();
        }
        if (reconnectTimer) {
          clearTimeout(reconnectTimer);
          reconnectTimer = null;
        }
      });

      setScaleSliderValue(latestState.modelScale);
      updateScaleLabel(latestState.modelScale);
      updateRotateLabel(latestState.rotateY);
      connect();
    })();
  </script>
</body>
</html>
