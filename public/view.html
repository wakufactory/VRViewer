<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>360° WebXR Viewer</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.7.0/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  <script src="stereo-sbs.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #222;}
    #file-input { position: absolute; top: 10px; left: 10px; z-index: 1000; }
    #play-pause-btn {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000; padding: 10px 20px;
      font-size: 16px; display: none;
    }
    #seek-bar {
      position: absolute; left: 50%; bottom: 10%;
      transform: translateX(-50%);
      z-index: 1000; width: 50%; display: none;
    }
    a-scene {
      width: 100%; height: 100%;
      position: absolute; top: 0; left: 0;
    }
    /* XR操作ボタン群 */
    #xr-button-bar {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 6vh);
      transform: translateX(-50%);
      z-index: 2000;
      display: none; /* XRサポートに応じて表示 */
      align-items: center;
      gap: 12px;
    }
    .xr-btn {
      padding: 10px 16px;
      font-size: 15px;
      border: none;
      border-radius: 6px;
      background: rgba(0,0,0,0.65);
      color: #fff;
      backdrop-filter: blur(2px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.25);
      cursor: pointer;
    }
    .xr-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <input type="file" id="file-input" accept="image/*,video/*,.glb,model/gltf-binary" />
  <button id="play-pause-btn">Play</button>
  <input type="range" id="seek-bar" min="0" max="100" step="0.1" value="0" />
  <pre id="folder-info" style="position:absolute; right:10px; top:10px; z-index:1000; background:rgba(0,0,0,0.5); color:#fff; padding:8px; margin:0; max-width:40vw; max-height:40vh; overflow:auto; font-size:12px; display:none"></pre>

  <a-scene background="color:#88c" embedded device-orientation-permission-ui="enabled:false" xr-mode-ui="enabled:false" isMobile="false">
    <a-assets>
      <img id="imageAsset" crossorigin="anonymous" />
      <video id="videoAsset" crossorigin="anonymous" webkit-playsinline playsinline  loop="false"></video>
    </a-assets>
    <a-entity id="camrig" rotation="0 180 0">
      <a-entity camera look-controls position="0 1.6 0"></a-entity>
      <a-entity id="lhand"
                hand-tracking-controls="hand: left;modelColor:#222;modelStyle:none"
                pinch-handler>
      </a-entity>
      <a-entity id="rhand"
                hand-tracking-controls="hand: right;modelColor:#222;modelStyle:none"
                pinch-handler>
      </a-entity>
      <a-entity id="left-controller" hand-controls="hand: left" controller-listener></a-entity>
      <a-entity id="right-controller" hand-controls="hand: right" controller-listener></a-entity>
    </a-entity>

    <!-- Media entities are injected dynamically by view modules -->
  </a-scene>

  <!-- XRモード切替ボタン -->
  <div id="xr-button-bar" role="group" aria-label="XR Mode Selection">
    <button id="enter-vr-btn" class="xr-btn" aria-label="Enter VR">Enter VR</button>
    <button id="enter-ar-btn" class="xr-btn" aria-label="Enter AR">Enter AR</button>
  </div>

  <script type="module" src="aframe-controls.js"></script>
  <script type="module" src="view.js"></script>
  <script>
    (function(){
      const sceneEl = document.querySelector('a-scene');
      const container = document.getElementById('xr-button-bar');
      const vrBtn = document.getElementById('enter-vr-btn');
      const arBtn = document.getElementById('enter-ar-btn');
      if (!sceneEl || !container || !vrBtn || !arBtn) return;

      // 現在表示されるボタンに応じてコンテナの可視性を調整する
      const syncContainerVisibility = () => {
        const shouldShow = vrBtn.style.display !== 'none' || arBtn.style.display !== 'none';
        container.style.display = shouldShow ? 'flex' : 'none';
      };

      // ブラウザのXRセッション対応状況を確認して各ボタンの表示を更新する
      function updateVisibility() {
        if (!('xr' in navigator) || typeof navigator.xr.isSessionSupported !== 'function') {
          // XR APIが無い環境ではVRボタンを常に表示する
          vrBtn.style.display = 'block';
          arBtn.style.display = 'none';
          syncContainerVisibility();
          return;
        }

        vrBtn.style.display = 'none';
        arBtn.style.display = 'none';
        syncContainerVisibility();

        navigator.xr.isSessionSupported('immersive-vr').then((supported) => {
          vrBtn.style.display = supported ? 'block' : 'none';
          syncContainerVisibility();
        }).catch(() => {
          vrBtn.style.display = 'block';
          syncContainerVisibility();
        });

        navigator.xr.isSessionSupported('immersive-ar').then((supported) => {
          arBtn.style.display = supported ? 'block' : 'none';
          syncContainerVisibility();
        }).catch(() => {
          arBtn.style.display = 'none';
          syncContainerVisibility();
        });
      }

      // immersive-vrがサポートされている場合にVRセッションを開始する
      vrBtn.addEventListener('click', () => {
        if (sceneEl && typeof sceneEl.enterVR === 'function') {
          sceneEl.enterVR();
        }
      });

      // immersive-arがサポートされている場合にARセッションを開始する
      arBtn.addEventListener('click', () => {
        if (sceneEl && typeof sceneEl.enterAR === 'function') {
          sceneEl.enterAR();
        }
      });

      sceneEl.addEventListener('enter-vr', () => { container.style.display = 'none'; });
      sceneEl.addEventListener('enter-ar', () => { container.style.display = 'none'; });
      sceneEl.addEventListener('exit-vr', updateVisibility);
      sceneEl.addEventListener('exit-ar', updateVisibility);

      // 初期状態のボタン表示を設定する
      updateVisibility();
    })();
  </script>

</body>
</html>
